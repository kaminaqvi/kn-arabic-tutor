<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KN Arabic Kids</title>
  <meta name="description" content="Arabic for children: picture words, letters, little duas, stars and stickers.">
  <meta name="theme-color" content="#DFF4F1">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icons/kids-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../icons/kids-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&family=Amiri+Quran&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/kids.css">
  <script>
    // Pick this child's database before the app loads (the active child, else the first child).
    (function () { try {
      var list = JSON.parse(localStorage.getItem('kn-profiles') || '[]'), id = localStorage.getItem('kn-active');
      var kids = list.filter(function (x) { return x.type === 'kid'; });
      var p = kids.filter(function (x) { return x.id === id; })[0] || kids[0];
      if (p) { localStorage.setItem('kn-active', p.id); window.KN_PROFILE_ID = p.id; }
      window.KN_DB = p ? p.db : 'kn-arabic-kids';
    } catch (e) { window.KN_DB = 'kn-arabic-kids'; } })();
  </script>
</head>
<body>
  <div id="app"><div class="k-boot">🐪</div></div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="../js/kids.js"></script>
</body>
</html>
